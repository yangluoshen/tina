<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>变更决策视图</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f5f5f5;
      --surface: #ffffff;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45, 49, 66, 0.14);
      --accent: #eb6c36;
      --accent-text: #a8421a;
      --accent-tint: #fff0e9;
      --link: #2e5aa8;
      --sans: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
    * { margin: 0; padding: 0; }
    body {
      min-width: 320px;
      min-height: 100vh;
      padding: 40px 24px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    .page { width: min(1120px, 100%); margin: 0 auto; }
    .eyebrow, .label, footer { font-family: var(--mono); }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--accent-text);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 { max-width: 800px; font-size: clamp(32px, 6vw, 56px); line-height: 1.08; }
    .thesis { max-width: 760px; margin: 16px 0 32px; color: var(--muted); font-size: 18px; line-height: 1.6; }
    .diagram { overflow-x: auto; padding: 8px 0 24px; }
    .diagram:focus-visible { outline: 2px solid var(--link); outline-offset: 4px; }
    svg { display: block; width: 100%; min-width: 760px; height: auto; }
    .brief {
      display: grid;
      grid-template-columns: 1.1fr 1fr 0.9fr;
      gap: 16px;
      margin-top: 24px;
    }
    .card { padding: 20px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
    .label { margin-bottom: 12px; color: var(--muted); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
    .card p, .card li { color: var(--muted); font-size: 14px; line-height: 1.6; }
    .card ul { padding-left: 20px; }
    footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 11px; }
    footer a { color: var(--link); }
    @media (max-width: 760px) {
      body { padding: 24px 16px; }
      .brief { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="eyebrow">Tina Change View</p>
      <h1>用变更标题替换此处</h1>
      <p class="thesis">用一句话呈现变更意图、价值和核心设计思想。</p>
    </header>

    <section class="diagram" aria-label="核心图示，可横向滚动" tabindex="0">
      <!-- Replace the placeholder with the one diagram that best accelerates this decision. -->
      <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="change-overview-title change-overview-desc">
        <title id="change-overview-title">变更核心图示</title>
        <desc id="change-overview-desc">展示 proposal 与 design 中的核心意图、主要关系和影响。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
        </defs>
        <rect width="1000" height="560" fill="#f5f5f5"/>

        <!-- Draw orthogonal connectors before nodes. Replace all placeholder content. -->
        <path d="M 280 280 H 420" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
        <path d="M 580 280 H 720" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>

        <rect x="80" y="220" width="200" height="120" rx="8" fill="#ffffff" stroke="#4f5d75"/>
        <text x="180" y="274" fill="#2d3142" font-family="PingFang SC, sans-serif" font-size="20" text-anchor="middle">当前问题</text>
        <text x="180" y="304" fill="#4f5d75" font-family="PingFang SC, sans-serif" font-size="14" text-anchor="middle">WHY / SCOPE</text>

        <rect x="420" y="200" width="160" height="160" rx="8" fill="#fff0e9" stroke="#eb6c36" stroke-width="2"/>
        <text x="500" y="274" fill="#2d3142" font-family="PingFang SC, sans-serif" font-size="20" font-weight="600" text-anchor="middle">核心变化</text>
        <text x="500" y="304" fill="#4f5d75" font-family="PingFang SC, sans-serif" font-size="14" text-anchor="middle">INTENT</text>

        <rect x="720" y="220" width="200" height="120" rx="8" fill="#ffffff" stroke="#4f5d75"/>
        <text x="820" y="274" fill="#2d3142" font-family="PingFang SC, sans-serif" font-size="20" text-anchor="middle">预期结果</text>
        <text x="820" y="304" fill="#4f5d75" font-family="PingFang SC, sans-serif" font-size="14" text-anchor="middle">IMPACT</text>
      </svg>
    </section>

    <section class="brief" aria-label="决策摘要">
      <article class="card">
        <p class="label">Scope / Non-goals</p>
        <p>只保留帮助判断范围的短句，不复制 Markdown 段落。</p>
      </article>
      <article class="card">
        <p class="label">Decisions</p>
        <p>提炼关键选择及被拒绝方案；没有 design.md 时明确省略。</p>
      </article>
      <article class="card">
        <p class="label">Risks / Impact</p>
        <p>只展示影响决策的风险、缓解措施和受影响系统。</p>
      </article>
    </section>

    <footer>
      Derived from <a href="proposal.md">proposal.md</a> and <a href="design.md">design.md</a> when present. Markdown sources are authoritative.
    </footer>
  </main>
</body>
</html>
